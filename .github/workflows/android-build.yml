name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshSOS-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # A workflow artifact is a zip behind a GitHub login, which is no use
      # when the APK has to reach a dozen handsets. This keeps one rolling
      # pre-release whose download link is public and stable, so the same
      # URL always serves the current build.
      - name: Publish rolling pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" MeshSOS-latest.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest MeshSOS-latest.apk \
            --title "MeshSOS latest debug build" \
            --prerelease \
            --notes "Debug build of ${{ github.sha }}. Install on Android 8 or newer and allow install from unknown sources. Not signed for distribution."
